<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交易日志 · 买入时机训练手册</title>
<style>
:root{color-scheme:light;--bg:#f4f6f3;--surface:#fff;--fg:#18211d;--muted:#5b6862;--line:#d6ddd8;--accent:#0d6b58;--soft:#eaeee9;--error:#a33f28}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "PingFang SC","Microsoft YaHei",sans-serif}a{color:var(--accent);text-underline-offset:4px}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);padding:9px 15px}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.page{max-width:1180px;margin:auto;padding:32px 24px 70px}header{border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--accent);margin:20px 0 8px}h1{font:600 34px/1.3 "Songti SC","Noto Serif CJK SC",serif;margin:0 0 12px}h2{font-size:21px;margin:0 0 16px}p{margin:0 0 12px}.muted,.hint{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}.toolbar a{font-size:14px}.layout{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:32px;margin-top:28px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;min-width:0}.sidebar{align-self:start}.count{font-size:13px;color:var(--muted);margin:0 0 18px}.entry-list{display:grid;gap:10px}.entry-card{display:block;width:100%;text-align:left;padding:14px;background:var(--bg)}.entry-card[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.entry-card strong{display:block;overflow-wrap:anywhere}.entry-card small{display:block;color:var(--muted);font-size:12px}.empty{padding:22px 0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:block;font-size:13px;color:var(--muted)}input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:6px;padding:9px 10px;min-height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}textarea{resize:vertical;min-height:120px}fieldset{border:0;margin:26px 0 0;padding:24px 0 0;border-top:1px solid var(--line);min-width:0}legend{float:left;font-size:15px;font-weight:600;margin-bottom:14px;width:100%}fieldset>div{clear:both}.full{grid-column:1/-1}.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}.check input{margin:5px 0 0;flex:none;width:17px;height:17px;accent-color:var(--accent)}details{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}summary{cursor:pointer;font-size:14px}.savebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:22px}.status{font-size:14px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}.status[data-error="true"]{color:var(--error)}.result{font-size:14px;background:var(--soft);padding:12px 14px;border-radius:6px;margin-top:16px}.result:empty{display:none}footer{margin-top:26px;color:var(--muted);font-size:12px}noscript{display:block;padding:20px;color:var(--error)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{order:2}.page{padding:20px 16px 50px}.panel{padding:20px}.entry-list{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}h1{font-size:29px}}
@media(max-width:480px){.grid{grid-template-columns:1fr;gap:13px}.full{grid-column:auto}.toolbar{gap:10px}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111614;--surface:#182019;--fg:#e4ebe6;--muted:#a0aea6;--line:#354239;--accent:#45c19e;--soft:#243127;--error:#ffac96}button.primary{color:#10241b}}
</style>
<style>.site-nav{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:20px;padding:12px max(16px,calc((100vw - 1120px)/2));background:var(--bg);border-bottom:1px solid var(--line);font-size:14px}.site-nav strong{margin-right:auto;white-space:nowrap}.site-nav a{white-space:nowrap;text-decoration:none}.site-nav a[aria-current]{font-weight:bold;border-bottom:2px solid var(--accent)}@media(max-width:480px){.site-nav{gap:14px;font-size:13px}.site-nav strong{font-size:12px}}nav.toc{top:72px}</style><nav class="site-nav" aria-label="站点导航"><strong>买入时机训练</strong><a href="./index.html" >完整手册</a><a href="./journal.html" aria-current="page">交易日志</a></nav><div class="page">
<header>
<a href="./index.html">← 买入时机训练手册</a>
<p class="eyebrow">记录判断，也记录执行</p>
<h1>交易日志</h1>
<p class="muted">每一笔，留下当时的计划与理由。复盘先看过程，再看结果。</p>
<div class="toolbar"><button id="connect" type="button">连接云端</button><button id="new" disabled>＋ 新建记录</button><button id="reload">重新读取记录</button><button id="export" type="button">导出备份</button></div>
<p class="hint">手册与日志均可公开查看。点击“连接云端”，在连接窗口登录后可新建或编辑自己的记录。</p>
<p id="connection" class="status" role="status" aria-live="polite">正在读取云端记录…</p>
</header>
<noscript>请启用 JavaScript 后使用日志。记录功能未启动。</noscript>
<div class="layout">
<aside class="panel sidebar" aria-label="已保存记录">
<h2>我的记录</h2><p id="count" class="count">尚未读取</p><div id="list" class="entry-list"></div>
</aside>
<main class="panel">
<h2 id="form-title">新建记录</h2><p class="hint">＊为必填。没有的信息留空；未勾选的清单也会如实保存。</p>
<form id="form">
<fieldset id="fields" disabled style="border:0;margin:0;padding:0">
<div class="grid">
<label class="field">记录时间（北京时间）＊<input name="date" type="datetime-local" required></label>
<label class="field">标的＊<input name="symbol" required maxlength="80" placeholder="填写实际交易标的" autocomplete="off"></label>
<label class="field">买点类型<select name="kind"><option>突破</option><option>回调</option><option>其他</option></select></label>
<label class="field">记录状态<select name="status"><option>计划</option><option>持仓中</option><option>已平仓</option></select></label>
</div>
<fieldset><legend>01 / 当时的计划</legend><div class="grid">
<label class="field">入场价格<input name="entry" type="number" min="0.00000001" step="any" inputmode="decimal"></label>
<label class="field">止损价格<input name="stop" type="number" min="0.00000001" step="any" inputmode="decimal"></label>
<label class="field">目标价格<input name="target" type="number" min="0.00000001" step="any" inputmode="decimal"></label>
<label class="field">实际仓位金额（USDT）<input name="position" type="number" min="0.00000001" step="any" inputmode="decimal"></label>
<label class="field full">开仓时计划的最大亏损 / 1R（USDT，含费用）<input name="risk" type="number" min="0.00000001" step="any" inputmode="decimal"><span class="hint">如实填写开仓时的计划值，复盘时保持该值，不以实际亏损倒推。</span></label>
</div></fieldset>
<fieldset><legend>02 / 执行与复盘</legend><div class="grid">
<label class="field">平仓时间（北京时间）<input name="exitDate" type="datetime-local"></label>
<label class="field">扣除全部费用后的净盈亏（USDT）<input name="pnl" type="number" step="any" inputmode="decimal" placeholder="亏损填负数，保本填 0"></label>
<label class="field">是否按计划执行<select name="process"><option value="">尚未复盘</option><option>按计划</option><option>未按计划</option></select></label>
<label class="field">原因归类<select name="cause"><option value="">尚未归类</option><option>判断错</option><option>执行错</option><option>运气</option></select></label>
<label class="field full">计划理由、财报安排与复盘笔记<textarea name="notes" maxlength="6000" placeholder="买入理由是什么？执行了哪些步骤？平仓后用一句话说明原因。"></textarea></label>
</div><div id="result" class="result" aria-live="polite"></div></fieldset>
<details><summary>03 / 交易前检查清单 · 保存当时的 11 项勾选</summary><div id="checks"></div></details>
<div class="savebar"><button id="save" class="primary" type="submit">保存记录</button><span id="dirty" class="hint">尚未保存</span></div>
</fieldset>
</form>
<p id="message" class="status" role="status" aria-live="polite"></p>
</main>
</div>
<footer>记录保存在云端，知道网址的人可查看。仅记录创建者登录后可修改自己的记录；请定期导出备份。此页不连接交易账户或行情。</footer>
</div>
<script src="./journal.js"></script>
</html>
